# Render blueprint — provisions the API, the database, and the daily scrape.
#
# Render reads this when you create a Blueprint from the repo. It does NOT
# create anything by itself; you connect the repo in the Render dashboard and
# approve the plan there.
#
# The frontend is NOT here — under Option B that deploys separately to Vercel.

databases:
  - name: jobaggregator-db
    databaseName: jobaggregator
    plan: free          # upgrade before real traffic; free tier expires
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: jobaggregator-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobaggregator-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true       # Render generates once and keeps it stable
      - key: CORS_ORIGINS
        sync: false               # set to your Vercel URL, e.g. https://yourapp.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false               # optional — omit to run normalization rules-only
      - key: PYTHON_VERSION
        value: "3.12"

  # ---------------------------------------------------------------- daily scrape
  # A cron job, not a background thread in the web service: the scrape is long
  # running and must not be killed by a web dyno restart or share its memory.
  - type: cron
    name: jobaggregator-daily
    runtime: python
    plan: free
    schedule: "0 2 * * *"        # 02:00 UTC = 07:30 IST
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/daily_run.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobaggregator-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false               # optional — Slack/Discord webhook for scrape alerts
      - key: PYTHON_VERSION
        value: "3.12"
