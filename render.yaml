# Render blueprint — provisions the API, the database, and the daily scrape.
#
# Render reads this when you create a Blueprint from the repo. It does NOT
# create anything by itself; you connect the repo in the Render dashboard and
# approve the plan there.
#
# The frontend is NOT here — under Option B that deploys separately to Vercel.

databases:
  - name: careerkartos-db
    databaseName: careerkartos
    plan: free          # upgrade before real traffic; free tier expires
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: careerkartos-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # preDeployCommand needs a paid plan — Render rejects it on free with
    # "pre-deploy command is not supported for free tier services", which
    # fails the Blueprint sync outright rather than degrading gracefully.
    # Free web services are single-instance, so the concurrent-ALTER risk
    # preDeployCommand exists to avoid does not apply yet. Folding the
    # migration into startCommand is the pragmatic substitute until this
    # service moves to a plan that supports multiple instances — at that
    # point this must go back to preDeployCommand, or two instances booting
    # together will race on the same ALTER.
    startCommand: alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerkartos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true       # Render generates once and keeps it stable
      - key: CORS_ORIGINS
        sync: false               # set to your Vercel URL, e.g. https://yourapp.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false               # optional — omit to run normalization rules-only
      - key: PYTHON_VERSION
        value: "3.12"

  # ---------------------------------------------------------------- daily scrape
  # A cron job, not a background thread in the web service: the scrape is long
  # running and must not be killed by a web dyno restart or share its memory.
  - type: cron
    name: careerkartos-daily
    runtime: python
    plan: starter                # cron has no free tier; billed per run,
                                 # $1/month minimum per cron service
    schedule: "0 2 * * *"        # 02:00 UTC = 07:30 IST
    buildCommand: pip install -r requirements.txt
    # alembic upgrade head is idempotent, so running it here too is a no-op
    # once the web service has already migrated. It is a safety net for the
    # case where the cron runs before the web service has, e.g. a manual
    # "Trigger Run" right after a Blueprint sync.
    startCommand: alembic upgrade head && python scripts/daily_run.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerkartos-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false               # optional — Slack/Discord webhook for scrape alerts
      - key: PYTHON_VERSION
        value: "3.12"
